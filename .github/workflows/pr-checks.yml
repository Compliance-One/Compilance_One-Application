name: PR Automated Checks

on:
  pull_request:
    branches: [ main ]
  # Allows you to trigger this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  backend-checks:
    name: Backend Tests & DB Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Automatically caches pip downloads to speed up runs

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Alembic Migrations (Catch uncommitted schema changes)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/compliance_one_ci.db
        run: |
          cd backend
          export PYTHONPATH=.
          mkdir -p data
          # 1. Apply all migrations to a fresh SQLite file
          alembic upgrade head
          # 2. Ensure models in entities.py match the DB schema perfectly
          alembic check

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/compliance_one_ci.db
        run: |
          cd backend
          export PYTHONPATH=.
          pytest tests/ -v

  mobile-checks:
    name: Mobile Type Check & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies (Strict)
        run: |
          cd mobile
          # 'npm ci' is strictly for CI/CD; it fails if package.json and lock file are out of sync
          npm ci 

      - name: TypeScript Compiler Check
        run: |
          cd mobile
          npx tsc --noEmit

      - name: ESLint Check (Optional - if configured)
        run: |
          cd mobile
          if [ -f eslint.config.js ] || [ -f .eslintrc ] || [ -f .eslintrc.js ] || [ -f .eslintrc.json ]; then
            npm run lint
          else
            echo "ESLint is not configured; skipping lint."
          fi
